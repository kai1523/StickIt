name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish EXE and package sample lists
        shell: pwsh
        run: .\publish.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assetDirectory = ".\dist\local\$version"
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $assetDirectory 'StickIt.exe') `
            (Join-Path '.\dist\local' "StickIt-v$version-win-x64.zip") `
            --title "StickIt $env:GITHUB_REF_NAME" `
            --generate-notes
